name: build

# - pull requests: vet + test + build (nothing is published)
# - push to main:  also publishes the images tagged `edge`
# - push of a tag vX.Y.Z: publishes versioned images (X.Y.Z, X.Y, latest),
#   signs them, attaches the OpenWrt binaries to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
      - name: vet
        working-directory: core
        run: go vet ./...
      - name: test
        working-directory: core
        run: go test -race ./...
      # The HA add-on pulls <image>:<version>, so the manifest version must be
      # the released tag. Same for the OpenWrt package.
      - name: versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          addon=$(sed -n 's/^version: *"\(.*\)"/\1/p' tunnelkit-client/config.yaml)
          owrt=$(sed -n 's/^PKG_VERSION:=//p' openwrt/Makefile)
          echo "tag=$tag add-on=$addon openwrt=$owrt"
          [ "$tag" = "$addon" ] && [ "$tag" = "$owrt" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match tunnelkit-client/config.yaml ($addon) and openwrt/Makefile ($owrt)"
            exit 1
          }

  # Two multi-arch images: tunnelkit-client and tunnelkit-server.
  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing (GitHub OIDC)
    strategy:
      matrix:
        include:
          - { name: client, dockerfile: docker/Dockerfile.client }
          - { name: server, dockerfile: docker/Dockerfile.server }
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/tunnelkit-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # Supply chain: an SBOM and SLSA provenance attached to the image.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v4.1.2
        if: env.PUBLISH == 'true'
      - name: sign (by digest, keyless)
        if: env.PUBLISH == 'true'
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/tunnelkit-${{ matrix.name }}@${{ steps.build.outputs.digest }}

  # CLIENT binary for OpenWrt (several arches).
  openwrt-client:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goarch: arm64 }
          - { goarch: arm, goarm: "7" }
          - { goarch: mips, gomips: softfloat }
          - { goarch: mipsle, gomips: softfloat }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
      - name: build client
        working-directory: core
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o ../tunnelkit-client-${{ matrix.goarch }} ./cmd/client
      - uses: actions/upload-artifact@v4
        with:
          name: tunnelkit-client-openwrt-${{ matrix.goarch }}
          path: tunnelkit-client-${{ matrix.goarch }}

  # Tagged builds only: GitHub release with the binaries and their checksums.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images, openwrt-client]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: tunnelkit-client-openwrt-*
          merge-multiple: true
          path: dist
      - name: checksums
        working-directory: dist
        run: sha256sum tunnelkit-client-* > SHA256SUMS
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Images: ghcr.io/${{ github.repository_owner }}/tunnelkit-{client,server}:${GITHUB_REF_NAME#v} (verify with cosign, see README)."
