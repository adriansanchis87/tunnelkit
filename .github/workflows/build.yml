name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # Two multi-arch images: tunnelkit-client and tunnelkit-server.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: client, dockerfile: docker/Dockerfile.client }
          - { name: server, dockerfile: docker/Dockerfile.server }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tunnelkit-${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/tunnelkit-${{ matrix.name }}:${{ github.ref_name }}

  # CLIENT binary for OpenWrt (several arches).
  openwrt-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goarch: arm64 }
          - { goarch: arm, goarm: "7" }
          - { goarch: mips, gomips: softfloat }
          - { goarch: mipsle, gomips: softfloat }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: build client
        working-directory: core
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o ../tunnelkit-client-${{ matrix.goarch }} ./cmd/client
      - uses: actions/upload-artifact@v4
        with:
          name: tunnelkit-client-openwrt-${{ matrix.goarch }}
          path: tunnelkit-client-${{ matrix.goarch }}
